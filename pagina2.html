<!DOCTYPE pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de produtos</title>
    <style>
        
/* Configuração Global e Cores */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f6f8;
    color: #333;
    padding: 30px;
    max-width: 1200px;
    margin: 0 auto;
}

/* Título Principal */
h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #2c3e50;
    font-size: 2.2rem;
}

/* Barra de Ferramentas (Busca e Botão) */
.toolbar {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.toolbar button {
    background-color: #3498db;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.1s ease;
    box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
}

.toolbar button:hover {
    background-color: #2980b9;
}

.toolbar button:active {
    transform: scale(0.98);
}

.toolbar input[type="text"] {
    padding: 12px 18px;
    font-size: 1rem;
    border: 2px solid #ddd;
    border-radius: 8px;
    width: 300px;
    max-width: 100%;
    outline: none;
    transition: border-color 0.3s ease;
}

.toolbar input[type="text"]:focus {
    border-color: #3498db;
}

/* Mensagens de Status / Carregamento */
#status {
    text-align: center;
    margin-bottom: 20px;
}

.loading {
    font-size: 1.1rem;
    color: #e67e22;
    font-weight: 600;
    padding: 10px;
}

/* Grid de Produtos */
#produtos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 25px;
}

/* Card do Produto */
.card {
    background-color: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    background-color: #ecf0f1;
}

/* Conteúdo interno do Card */
.card-content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.card-content h3 {
    font-size: 1.15rem;
    margin-bottom: 10px;
    color: #2c3e50;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.descricao {
    font-size: 0.9rem;
    color: #7f8c8d;
    margin-bottom: 15px;
    flex-grow: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.preco {
    font-size: 1.25rem;
    font-weight: 700;
    color: #27ae60;
    margin-bottom: 12px;
}

/* Informações extras (Avaliação e Categoria) */
.info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    border-top: 1px solid #eee;
    padding-top: 12px;
    color: #95a5a6;
}

.info span:first-child {
    background-color: #fef9e7;
    color: #f39c12;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
}

.info span:last-child {
    background-color: #ebf5fb;
    color: #3498db;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: capitalize;
    font-weight: 600;
}

/* Responsividade para telas menores */
@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .toolbar input[type="text"] {
        width: 100%;
    }
}

</style>
    
</head>
<body>


    <h1>Catalogo de Produtos</h1>
    
    <div class="toolbar">
        <button onclick="carregarProdutos();"> Buscar Produto</button>
        <input type="text" id="pesquisa" placeholder="Pesquisar Produtos" onkeyup="filtrarProdutos();">
    </div>


    <div id="status"></div>
    <div id="produtos"></div>

<script>


let listarProdutos = [];

async function carregarProdutos(){

    document.getElementById("status").innerHTML = 
    '<div class="loading"> carregando... </div>';

 try{
          const response = await fetch(
        "https://dummyjson.com/products"
    );

    console.log(response);

    const dados = await response.json();

    listarProdutos = dados.products;

    exibirProdutos (listarProdutos);

    document.getElementById("status").innerHTML = "";

} catch (erro){
    console.error(erro);

    document.getElementById("status").innerHTML= '<div class="loading"> Erro ao carregar produtos. </div>';
}

}

function exibirProdutos(produtos){
    const container = document.getElementById("produtos");
    container.innerHTML = "";
    
    produtos.forEach(produto => {
     container.innerHTML += `
     <div class="card"> 
        <img src="${produto.thumbnail}" alt="${produto.title}">
            <div class="card-content">
                <h3>${produto.title}</h3>
                <p class="descricao">
                ${produto.description}</p>

                <div class="preco">US$ ${produto.price}</div>
                <div class="info">
                    <span>⭐ ${produto.rating}</span>
                    <span> ${produto.category}</span>

                </div>
            </div>
        </div>
        
        `;   
    });
}



</script>

</body>
</html>
